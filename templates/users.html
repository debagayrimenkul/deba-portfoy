{% extends 'base.html' %}{% block body %}<h1>Kullanıcı Yönetimi</h1><form method="post" class="form compact"><label>Ad Soyad<input name="name" required></label><label>Kullanıcı adı<input name="username" required></label><label>Şifre<input name="password" type="password" required></label><label>Rol<select name="role"><option value="user">Danışman</option><option value="admin">Admin</option></select></label><button>Yeni Kullanıcı Oluştur</button></form><table><tr><th>Ad</th><th>Kullanıcı</th><th>Rol</th><th>Durum</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{x.username}}</td><td>{{x.role}}</td><td>{{'Aktif' if x.active else 'Pasif'}}</td></tr>{% endfor %}</table>{% endblock %}

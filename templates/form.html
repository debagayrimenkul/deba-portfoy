{% extends 'base.html' %}
{% block body %}

<h1>{{ 'Portföy Düzenle' if p else 'Yeni '~tt~' Portföy' }}</h1>

<form method="post" class="form" id="pf">

<label>
    Tipi
    <select name="property_type" id="ptype" required>
        {% for x in ['Daire','Villa','İş Yeri','Arsa'] %}
        <option {% if p and p.property_type==x %}selected{% endif %}>{{x}}</option>
        {% endfor %}
    </select>
</label>

<div class="normal">

    <label>
        Proje Adı
        <input name="project_name"
               value="{{p.project_name if p else ''}}">
    </label>

    <label>
        Blok
        <input name="block"
               value="{{p.block if p else ''}}">
    </label>

    <label>
        Daire No
        <select name="apartment_no">
            <option value="">-</option>
            {% for x in range(1,201) %}
            <option {% if p and p.apartment_no==x %}selected{% endif %}>
                {{x}}
            </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Oda Sayısı
        <select name="rooms">
            <option value="">-</option>
            {% for x in ['1+0','1+1','1,5+1','2+1','2,5+1','3+1','4+1','5+1','5+2','6+1','6+2'] %}
            <option {% if p and p.rooms==x %}selected{% endif %}>
                {{x}}
            </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Bulunduğu Kat
        <select name="floor">
            <option value="">-</option>
            {% for x in range(0,31) %}
            <option {% if p and p.floor==x %}selected{% endif %}>
                {{x}}
            </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Cephe
        <select name="facade">
            <option value="">-</option>
            {% for x in ['Kuzey','Güney','Doğu','Batı','Kuzey-Doğu','Kuzey-Batı','Güney-Doğu','Güney-Batı'] %}
            <option {% if p and p.facade==x %}selected{% endif %}>
                {{x}}
            </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Kullanım Durumu
        <select name="usage_status">
            <option value="">-</option>
            {% for x in ['Boş','Kiracılı','Mal sahibi oturuyor'] %}
            <option {% if p and p.usage_status==x %}selected{% endif %}>
                {{x}}
            </option>
            {% endfor %}
        </select>
    </label>

</div>

<div class="location">

    <label>
        İl
        <input name="province"
               value="{{p.province if p else ''}}">
    </label>

    <label>
        İlçe
        <input name="district"
               value="{{p.district if p else ''}}">
    </label>

    <label>
        Mahalle
        <input name="neighborhood"
               value="{{p.neighborhood if p else ''}}">
    </label>

</div>

<div class="land">

    <label>
        Ada No
        <input name="island_no"
               value="{{p.island_no if p else ''}}">
    </label>

    <label>
        Parsel No
        <input name="parcel_no"
               value="{{p.parcel_no if p else ''}}">
    </label>

</div>

<label>
    m²
    <input name="sqm"
           type="number"
           step="0.01"
           value="{{p.sqm if p else ''}}"
           required>
</label>

<label>
    Fiyat (TL)
    <input name="price"
           type="number"
           step="0.01"
           value="{{p.price if p else ''}}"
           required>
</label>

{% if u.role=='admin' %}

<label>
    Danışman
    <select name="advisor_id">
        {% for a in advisors() %}
        <option value="{{a.id}}"
        {% if p and p.advisor_id==a.id %}selected{% endif %}>
            {{a.name}}
        </option>
        {% endfor %}
    </select>
</label>

<label>
    Portföy Sahibi
    <input name="owner_name"
           value="{{p.owner_name if p and p.owner_name else ''}}">
</label>

<label>
    Telefon
    <input name="owner_phone"
           type="tel"
           value="{{p.owner_phone if p and p.owner_phone else ''}}">
</label>

{% endif %}

<label class="wide">
    Açıklama
    <textarea name="description"
              rows="5">{{p.description if p else ''}}</textarea>
</label>

<button class="wide">Kaydet</button>

</form>

<script>

function sw(){

    let type=document.getElementById('ptype').value;

    let arsa = type==='Arsa';

    document.querySelectorAll('.land').forEach(
        x=>x.style.display='contents'
    );

    document.querySelectorAll('.normal').forEach(
        x=>x.style.display=arsa?'none':'contents'
    );
}

document.getElementById('ptype').onchange=sw;

sw();

</script>

{% endblock %}

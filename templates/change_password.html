{% extends 'base.html' %}

{% block body %}

<h1>Şifremi Değiştir</h1>

<form method="post" class="form">

    <div class="wide">
        <label>
            Mevcut Şifre
            <input
                type="password"
                name="current_password"
                required
                autocomplete="current-password">
        </label>
    </div>

    <div class="wide">
        <label>
            Yeni Şifre
            <input
                type="password"
                name="new_password"
                required
                minlength="6"
                autocomplete="new-password">
        </label>
    </div>

    <div class="wide">
        <label>
            Yeni Şifre Tekrar
            <input
                type="password"
                name="confirm_password"
                required
                minlength="6"
                autocomplete="new-password">
        </label>
    </div>

    <div class="wide">
        <button type="submit" class="button" style="width:100%;">
            Şifremi Değiştir
        </button>
    </div>

</form>

{% endblock %}
